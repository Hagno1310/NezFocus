# Single-VM deploy for MVP-Đồ án (SRS 7.1.1). On the VM:
#   cp infra/.env.prod.example infra/.env.prod   # fill in secrets
#   cp infra/seaweedfs/s3.prod.example.json infra/seaweedfs/s3.prod.json  # same keys as S3_*
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d
# The backend image comes from CI (GHCR); set BACKEND_IMAGE, or uncomment `build` to build on the VM.
name: nezfocus

x-backend-env: &backend-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET}
  S3_ENDPOINT: http://s3:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: nezfocus

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [backend]

  migrate:
    image: ${BACKEND_IMAGE}
    # build: { context: .., dockerfile: apps/backend/Dockerfile }
    command: ['node', 'dist/db/migrate.js']
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }

  backend:
    image: ${BACKEND_IMAGE}
    # build: { context: .., dockerfile: apps/backend/Dockerfile }
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redisdata:/data]

  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    volumes:
      - ./seaweedfs/s3.prod.json:/etc/seaweedfs/s3.json:ro
      - s3data:/data

volumes:
  caddy_data:
  pgdata:
  redisdata:
  s3data:
