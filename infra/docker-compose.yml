# Local dev services for MVP-Đồ án (SRS 7.1.1). Credentials match apps/backend/.env.example.
# Add Meilisearch / ClamAV when the features that need them start.
name: nezfocus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nezfocus
      POSTGRES_PASSWORD: nezfocus
      POSTGRES_DB: nezfocus
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nezfocus']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  # S3-compatible storage (SRS names MinIO; MinIO stopped publishing community images).
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports: ['8333:8333']
    volumes:
      - ./seaweedfs/s3.dev.json:/etc/seaweedfs/s3.json:ro
      - s3data:/data

  # REQ-VC-01 / VC-08: SFU + built-in TURN/UDP. LIVEKIT_NODE_IP = this PC's LAN IP so a phone on
  # the same Wi-Fi reaches the media ports (docs/getting-started.md).
  livekit:
    image: livekit/livekit-server:v1.9
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - '7880:7880'
      - '7881:7881'
      - '3478:3478/udp'
      - '50000-50100:50000-50100/udp'
    volumes:
      - ./livekit/livekit.dev.yaml:/etc/livekit.yaml:ro
    extra_hosts: ['host.docker.internal:host-gateway']

volumes:
  pgdata:
  s3data:
